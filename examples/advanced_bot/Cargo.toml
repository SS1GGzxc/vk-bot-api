[package]
name = "advanced-bot"
version = "0.1.0"
edition = "2024"

[dependencies]
vk-bot-api = { path = "../../", features = ["full"] }
tokio = { version = "1.49", features = ["full", "macros", "rt-multi-thread"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.9"
env_logger = "0.11"
dotenv = "0.15"
log = "0.4"
async-trait = "0.1.89"
