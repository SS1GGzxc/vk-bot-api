name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 1
  CARGO_PROFILE_RELEASE_DEBUG: 0

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust: [stable]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: ${{ matrix.rust }}
        components: rustfmt, clippy

    - name: Cache dependencies
      uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ matrix.rust }}-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-${{ matrix.rust }}-

    - name: Check formatting
      run: cargo fmt -- --check

    - name: Clippy check
      run: cargo clippy --all-targets --all-features -- -D warnings

    - name: Build library
      run: cargo build --verbose

    - name: Build examples
      run: |
        cargo build --examples --verbose
        cargo build --examples --verbose --release

    - name: Run tests
      run: cargo test --verbose

    - name: Run doctests
      run: cargo test --doc --verbose

  docs:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rust-docs

    - name: Build documentation
      run: cargo doc --no-deps --all-features

    - name: Deploy documentation
      uses: peaceiris/actions-gh-pages@v4
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./target/doc
        destination_dir: ./docs

  publish:
    runs-on: ubuntu-latest
    needs: [build-and-test, docs]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
            # Verify package
            cargo package --list

            # Check if version matches tag
            PACKAGE_VERSION=$(grep -m1 'version =' Cargo.toml | cut -d '"' -f2)
            TAG_VERSION=${GITHUB_REF#refs/tags/v}

            echo "Package version: $PACKAGE_VERSION"
            echo "Tag version: $TAG_VERSION"

            if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
              echo "ERROR: Version in Cargo.toml ($PACKAGE_VERSION) doesn't match tag version ($TAG_VERSION)"
              exit 1
            fi

            # Publish
            cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }} --verbose

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  security:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
    - uses: actions/checkout@v6

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Generate Cargo.lock
      run: cargo generate-lockfile

    - name: Security audit
      run: |
          # Устанавливаем cargo-audit если нет
          if ! command -v cargo-audit &> /dev/null; then
            cargo install cargo-audit
          fi
          cargo audit

    - name: Cargo deny check
      uses: EmbarkStudios/cargo-deny-action@v2
      with:
        command: check bans sources

  examples:
    runs-on: ubuntu-latest
    needs: build-and-test
    strategy:
      matrix:
        example: [simple_bot, advanced_bot]

    steps:
    - uses: actions/checkout@v6

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Run example
      working-directory: ./examples/${{ matrix.example }}
      run: |
        cargo check --verbose
        cargo build --verbose
        echo "Example ${{ matrix.example }} built successfully"
