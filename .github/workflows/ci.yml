name: CI

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 1
  CARGO_PROFILE_RELEASE_DEBUG: 0

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust: [stable]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: ${{ matrix.rust }}
        components: rustfmt, clippy

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ matrix.rust }}-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-${{ matrix.rust }}-

    - name: Check formatting
      run: cargo fmt -- --check

    - name: Clippy check
      run: cargo clippy --all-targets --all-features -- -D warnings

    - name: Build library
      run: cargo build --verbose

    - name: Build examples
      run: |
        cargo build --examples --verbose
        cargo build --examples --verbose --release

    - name: Run tests
      run: cargo test --verbose

    - name: Run doctests
      run: cargo test --doc --verbose

  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: build-and-test
    # if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rust-docs

    - name: Build documentation
      run: cargo doc --no-deps --all-features

    - name: Deploy documentation
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./target/doc/vk_bot_api

  security:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
    - uses: actions/checkout@v6

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Generate Cargo.lock
      run: cargo generate-lockfile

    - name: Security audit
      run: |
          if ! command -v cargo-audit &> /dev/null; then
            cargo install cargo-audit
          fi
          cargo audit

    - name: Cargo deny check
      uses: EmbarkStudios/cargo-deny-action@v2
      with:
        command: check bans sources

  publish:
    runs-on: ubuntu-latest
    needs: [build-and-test, docs, security]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
            # Проверка содержимого пакета перед публикацией
            cargo package --list

            # Надежное извлечение версии из Cargo.toml
            TOML_VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
            TAG_VERSION=${GITHUB_REF#refs/tags/v}

            echo "Package version: $TOML_VERSION"
            echo "Tag version: $TAG_VERSION"

            if [ "$TOML_VERSION" != "$TAG_VERSION" ]; then
              echo "ERROR: Version in Cargo.toml ($TOML_VERSION) doesn't match tag version ($TAG_VERSION)"
              exit 1
            fi

            # Публикация
            cargo publish

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
